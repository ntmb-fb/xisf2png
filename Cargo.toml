[package]
name = "xisf2png"
version = "0.9.3"
edition = "2021"
description = "Convert XISF and FITS astronomical images to PNG, 4K-resized and stamped with the object name"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "xisf2png"
path = "src/main.rs"

[[bin]]
name = "xisf2png-gui"
path = "src/bin/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:winreg"]

[dependencies]
astropng-core = { git = "https://github.com/ntmb-fb/astropng-core", tag = "v0.2.1" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"], optional = true }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "common-controls-v6"], optional = true }

# Windows only: registry access for the Explorer context-menu entry (no
# reg.exe child process), and version-info + icon resources for the .exe files.
[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
